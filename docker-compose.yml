# GeraldOS — Docker Compose deployment bundle.
#
# Lean production topology: app + PostgreSQL + Orthanc + OHIF.
#
# Start everything:  docker compose up -d
# Environment variables are read from .env (see .env.example for reference).

services:

  # ─── Core: Application ────────────────────────────────────────────────────────

  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ─── Core: PostgreSQL ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: geraldos_admin
      POSTGRES_PASSWORD: geraldos_secure_pass
      POSTGRES_DB: geraldos
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geraldos_admin -d geraldos"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ─── Core: Orthanc PACS ──────────────────────────────────────────────────────

  orthanc:
    build:
      context: .
      dockerfile: docker/orthanc/Dockerfile
    environment:
      ORTHANC__NAME: GeraldOS-PACS
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__PLUGINS: '["/usr/share/orthanc/plugins/libOrthancDicomWeb.so"]'
      ORTHANC__REGISTERED_USERS: |-
        {"orthanc": "orthanc_secure_pass"}
    ports: ["8042:8042"]
    volumes:
      - orthancdata:/var/lib/orthanc/db
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,base64;req=urllib.request.Request('http://localhost:8042/system');req.add_header('Authorization','Basic '+base64.b64encode(b'orthanc:orthanc_secure_pass').decode());urllib.request.urlopen(req,timeout=3).read()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # ─── Core: OHIF Viewer (private — mounted at /viewer via the app proxy) ──────

  ohif:
    build:
      context: .
      dockerfile: docker/ohif/Dockerfile
    # No public port: the app edge proxy mounts OHIF at /viewer on the app
    # origin, exactly like the Render topology (scripts/edge-proxy.mjs).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  orthancdata:
