# ─── GeraldOS Render Blueprint — lean production topology ───
# GeraldOS (web, with in-container edge proxy) + PostgreSQL + Orthanc (private)
# + OHIF (private, mounted same-origin at /viewer through the app proxy).
#
# Usage:
#   1. Push this file to your repo.
#   2. Render Dashboard → New → Blueprint → Connect digitwinxr-max/geraldos-radiology.
#   3. Render creates the database, the web service and the two private
#      services, and wires all env vars.
#
# Viewer topology: OHIF is a PRIVATE service with no public URL. The GeraldOS
# web service runs scripts/edge-proxy.mjs, which mounts OHIF at /viewer on the
# app's own origin. The embedded workstation viewer is therefore same-origin:
# the GeraldOS session cookie (SameSite=Lax) flows on every DICOMweb call and
# the browser never talks to Orthanc or OHIF directly.
#
# First deployment (automatic):
#   - Postgres `geraldos-db` is created.
#   - The GeraldOS web service builds the Docker image; Render then runs the
#     preDeployCommand (`node scripts/db-seed.mjs migrate`) BEFORE starting the
#     app, so the application never boots against an unmigrated schema.
#   - Administrator bootstrap runs explicitly (one-time): see
#     docs/DEPLOYMENT.md → step 3.
# No demo data is seeded automatically on any deployment (the seed command
# refuses NODE_ENV=production).

services:
  # ── GeraldOS Web Service ────────────────────────────────────────────────
  - type: web
    name: geraldos-radiology
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    # Runs AFTER the image build, BEFORE the new version is deployed, on a
    # separate instance WITH this service's env vars. Migration failure fails
    # the deploy — the app never starts against an unmigrated schema.
    preDeployCommand: node scripts/db-seed.mjs migrate
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: geraldos-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      # First administrator — one-time explicit bootstrap. Set these as
      # secrets in the Render Dashboard, then run from the service's Render
      # Shell: node scripts/db-seed.mjs bootstrap-admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: PORT
        value: "3000"
      # ── Orthanc (private service, same region) ──────────────────────────
      - key: ORTHANC_URL
        fromService:
          name: geraldos-orthanc
          type: pserv
          property: hostport
      - key: ORTHANC_USERNAME
        value: orthanc
      # Set ORTHANC_PASSWORD in the Dashboard to match the Orthanc private
      # service's ORTHANC__REGISTERED_USERS value.
      - key: ORTHANC_PASSWORD
        sync: false
      # ── OHIF Viewer (PRIVATE service, mounted at /viewer by the edge proxy)
      # Server-side only: used by the edge proxy and the integrations health
      # check. The browser reaches OHIF exclusively through this app.
      - key: OHIF_URL
        fromService:
          name: geraldos-ohif
          type: pserv
          property: hostport

  # ── Orthanc PACS — private (no public exposure) ─────────────────────────
  - type: pserv
    name: geraldos-orthanc
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./docker/orthanc/Dockerfile
    disk:
      name: orthanc-data
      mountPath: /var/lib/orthanc/db
      sizeGB: 10
    envVars:
      - key: ORTHANC__NAME
        value: GeraldOS-PACS
      - key: ORTHANC__DICOM_WEB__ENABLE
        value: "true"
      - key: ORTHANC__AUTHENTICATION_ENABLED
        value: "true"
      - key: ORTHANC__PLUGINS
        value: '["/usr/share/orthanc/plugins/libOrthancDicomWeb.so"]'
      # Set ORTHANC__REGISTERED_USERS to {"orthanc":"<strong-password>"} in
      # the Dashboard; keep it identical to the GeraldOS web service's
      # ORTHANC_PASSWORD.
      - key: ORTHANC__REGISTERED_USERS
        sync: false

  # ── OHIF Viewer — PRIVATE service (no public URL) ────────────────────────
  # Reached only by the GeraldOS edge proxy over the private network and
  # mounted at /viewer on the app origin (see scripts/edge-proxy.mjs and
  # ohif-config/app-config.js routerBasename).
  - type: pserv
    name: geraldos-ohif
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./docker/ohif/Dockerfile
    envVars:
      - key: PUBLIC_URL
        value: /

# ── PostgreSQL ────────────────────────────────────────────────────────────
# Paid plan: clinical data must survive — the free tier expires after 30
# days, is capped at 1 GB and has no backups.
databases:
  - name: geraldos-db
    databaseName: geraldos
    user: geraldos_admin
    plan: 0.1c-256mb
