# ─── GeraldOS Render Blueprint ───
# Auto-provisions PostgreSQL + the Next.js web service.
#
# Usage:
#   1. Push this file to your repo
#   2. Render Dashboard → New → Blueprint → Connect digitwinxr-max/geraldos-radiology
#   3. Render will create the database + web service with all env vars linked
#
# If you already have a manual service, delete it first, then use Blueprint.

services:
  # ── Next.js Web Service ──
  - type: web
    name: geraldos-radiology
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: geraldos-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: REDIS_URL
        value: ""  # Optional — add Upstash Redis URL here if needed
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: PORT
        value: "3000"
    healthCheckPath: /api/health
    autoDeploy: true

# ── PostgreSQL Database ──
databases:
  - name: geraldos-db
    plan: free
    databaseName: geraldos
    user: geraldos_admin
